[workspace]
members = [
  "crates/analyzer-cli",
  "crates/analyzer-core",
  "src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96.0"
version = "0.1.0"

[workspace.dependencies]
analyzer-core = { path = "crates/analyzer-core" }
blake3 = "1"
ignore = "0.4"
oxc_allocator = "=0.148.0"
oxc_ast = "=0.148.0"
oxc_ast_visit = "=0.148.0"
oxc_parser = "=0.148.0"
oxc_span = "=0.148.0"
oxc_syntax = "=0.148.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
thiserror = "2"
