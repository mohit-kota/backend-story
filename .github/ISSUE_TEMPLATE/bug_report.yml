name: Bug report
description: Report incorrect behavior or a regression
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove proprietary source, secrets, and personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small public fixture or clear steps.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact paths and sensitive repository content.
